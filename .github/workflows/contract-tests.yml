name: Contract tests

# Enforces PROJECT_EXECUTION_PLAN.md SS6.2 and team_tasks/00_interfaces_and_handoff.md Part 2:
# every module's output must match shared/schemas.py before a PR can merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pytest open3d
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r security/requirements.txt
          pip install -r dashboard/backend/requirements.txt
          pip install httpx  # needed for fastapi.testclient.TestClient

      - name: Run contract tests
        run: pytest tests/test_contracts.py -v

      - name: Run module test suites
        run: pytest tracking/tests/ grid_engine/tests/ -v

      - name: Run security + dashboard auth/RBAC/input-validation test suites
        run: pytest security/tests/ dashboard/backend/tests/ -v
