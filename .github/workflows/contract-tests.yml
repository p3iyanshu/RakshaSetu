name: Contract tests

# Enforces PROJECT_EXECUTION_PLAN.md SS6.2 and team_tasks/00_interfaces_and_handoff.md Part 2:
# every module's output must match shared/schemas.py before a PR can merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy scikit-learn pytest open3d
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r security/requirements.txt
          pip install httpx  # needed for fastapi.testclient.TestClient
          # dashboard/backend/ (the FastAPI service security/tests's dashboard
          # suite exercises) is not present on every branch -- e.g. a static-
          # site dashboard redesign -- so this install is conditional rather
          # than a hard failure when the path doesn't exist.
          if [ -f dashboard/backend/requirements.txt ]; then
            pip install -r dashboard/backend/requirements.txt
          fi

      - name: Run contract tests
        run: pytest tests/test_contracts.py -v

      - name: Run module test suites
        run: pytest tracking/tests/ grid_engine/tests/ -v

      - name: Run security test suite
        run: pytest security/tests/ -v

      - name: Run dashboard auth/RBAC/input-validation test suite
        if: hashFiles('dashboard/backend/tests/**') != ''
        run: pytest dashboard/backend/tests/ -v
